services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/static:/app/gateway/static
    depends_on:
      - character_service
      - word_service
    environment:
      - CHAR_URL=http://character_service:8001
      - WORD_URL=http://word_service:8002
      - S3_BUCKET=ocr-storage-anas-470895881101
      - DATABASE_URL=postgresql://ocr_admin:Ocr_Void_#123@ocr-db.chi4cw8osd0x.eu-north-1.rds.amazonaws.com:5432/postgres
    mem_limit: 200m

  character_service:
    build:
      context: .
      dockerfile: classifier/character-classifier/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./model:/app/model
    environment:
      - MODEL_PATH=/app/model/ocr_model.pth
    mem_limit: 1GB

  word_service:
    build:
      context: .
      dockerfile: classifier/word-classifier/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./model:/app/model
    environment:
      - MODEL_PATH=/app/model/ocr_model.pth
    mem_limit: 1GB
