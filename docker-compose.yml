services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/static:/app/static
    depends_on:
      - character_service
      - word_service
      - logger
    environment:
      - CHAR_URL=http://character_service:8001
      - WORD_URL=http://word_service:8002
      - LOGGER_URL=http://logger:8003/log
    mem_limit: 200m

  character_service:
    build:
      context: .
      dockerfile: classifier/character-classifier/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./model:/app/model
    environment:
      - MODEL_PATH=/app/model/ocr_model.pth
    depends_on:
      - logger
    mem_limit: 1GB

  word_service:
    build:
      context: .
      dockerfile: classifier/word-classifier/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./model:/app/model
    environment:
      - MODEL_PATH=/app/model/ocr_model.pth
    depends_on:
      - logger
    mem_limit: 1GB

  logger:
    build:
      context: .
      dockerfile: logger/Dockerfile
    ports:
      - "8003:8003"
    mem_limit: 100m
